<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Визитка</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebe1, #89a7ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.19);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Здесь вы можете изменить текст на свой -->
        <h1>Привет! 👋</h1>
        <p>Вы отсканировали QR-код и попали на мой первый одностраничный сайт.</p>
        <p>Здесь можно разместить информацию о вас, ваши контакты или портфолио.</p>
        <a href="https://t.me" class="btn" target="_blank">Написать мне</a>
    </div>

</body>
</html>
